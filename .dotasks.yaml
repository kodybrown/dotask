version: 1
name: DoTask
description: Portable, cross-platform tasks written in the language of your choice.
settings:
  solution: dotask.slnx
  sdks:
    config: .tasks/sdks.yaml
  app:
    version: '0.1.yyDDD.HHmm'
    git-hash: short
    dirty-suffix: true
  installer:
    config: .tasks/installer.yaml
    output: artifacts/installers
    installer_file: './artifacts/installers/${os}-${arch}/dotask-*/dotask-setup-v${version}${exe-extension}'
    select: highest-version
  doinstall:
    source: ../doinstall
