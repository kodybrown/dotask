[package]
name = "dotask-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
anyhow = "1"
ctrlc = "3.5"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Environment", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem"] }
