# Build-machine steps are not distributed. runtime owns destination behavior.
schema: 1
application:
  id: dotask
  name: DoTask
  author: Kody Brown
  copyright: Copyright (C) 2026 Kody Brown
  description: Portable project tasks, in the language of your choice, for any platform.
build-steps:
  - run: _/doinstall/build
    with:
      stage-dir: '${staging}/tools'
  - run: build
    with:
      build-info: '${build-info}'
      stage-dir: '${staging}/app'
    gather:
      - from: '${staging}/app'
        files: ['dotask${exe-extension}', 'sdk/**']
        to: .
  - run: _/doinstall/assemble
    with:
      builder: '${staging}/tools/doinstall-builder${exe-extension}'
      installer: '${staging}/tools/doinstall${exe-extension}'
      config: '${config}'
      output: '${package}'
  # Enable either step, or substitute another archive task such as a RAR creator.
  - run: _/archive/create-zip
    enabled: false
    with:
      source: '${package}'
      output: '${package}.zip'
  - run: _/archive/create-7z
    enabled: false
    with:
      source: '${package}'
      output: '${package}.7z'
runtime:
  interactive: true
  commands:
    - name: dotask
      executable: 'dotask${exe-extension}'
  shortcuts: []
  inputs:
    install-dir:
      type: path
      required: true
      prompt: Install dotask in
    additional-command:
      type: boolean
      default: false
      prompt: Place an additional dotask command in another directory?
  defaults:
    common:
      additional-command: false
    windows:
      add-to-path: true
