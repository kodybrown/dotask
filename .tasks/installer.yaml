# Build-machine steps are not distributed. runtime owns destination behavior.
schema: 1
application:
  id: dotask
  name: DoTask
  author: Kody Brown
  copyright: Copyright (C) 2026 Kody Brown
  description: Portable project tasks, in the language of your choice, for any platform.
build-steps:
  # Consume the successful inspected snapshot. Assembly must not rebuild it.
  - run: stage-build
    with:
      stage-dir: '${staging}/app'
    gather:
      - from: '${staging}/app'
        files: ['dotask${exe-extension}', 'sdk/**', LICENSE.md]
        to: .
  - run: _/doinstall/assemble-self-extracting
    with:
      builder: '${builder}'
      installer: '${installer}'
      launcher-template: '${launcher-template}'
      config: '${config}'
      output: '${package}'
      result-file: '${result-file}'
  # Optional archives wrap the delivery directory containing the single launcher.
  - run: _/archive/create-zip
    enabled: false
    with:
      source: '${package}'
      output: '${package}.zip'
  - run: _/archive/create-7z
    enabled: false
    with:
      source: '${package}'
      output: '${package}.7z'
runtime:
  interactive: true
  commands:
    - name: dotask
      executable: 'dotask${exe-extension}'
  shortcuts: []
  inputs:
    install-dir:
      type: path
      required: true
      prompt: Install dotask in
    additional-command:
      type: boolean
      default: false
      prompt: Place an additional dotask command in another directory?
  defaults:
    common:
      additional-command: false
    windows:
      add-to-path: true
