name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned doinstall source
        uses: actions/checkout@v4
        with:
          repository: kodybrown/doinstall
          ref: d986d33b60eb8da0c46816ac6c2b1257231664a1
          path: doinstall-source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Build, verify and create dotask installer (Windows)
        # The explicit local workflow prepares doinstall and verifies both projects.
        if: runner.os == 'Windows'
        shell: cmd
        env:
          DOINSTALL_SOURCE: ${{ github.workspace }}/doinstall-source
        run: build.cmd create-dotask-installer --source "%DOINSTALL_SOURCE%"
      - name: Build, verify and create dotask installer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          DOINSTALL_SOURCE: ${{ github.workspace }}/doinstall-source
        run: ./build.sh create-dotask-installer --source "$DOINSTALL_SOURCE"
