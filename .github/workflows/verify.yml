name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            launcher: ./build.sh
            shell: bash
          - os: macos-latest
            launcher: ./build.sh
            shell: bash
          - os: windows-latest
            launcher: build.cmd
            shell: cmd
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned doinstall source
        uses: actions/checkout@v4
        with:
          repository: kodybrown/doinstall
          ref: 1a1567568393f6557c597bd2b618f4bd75ecf7fc
          path: doinstall-source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Build, verify and create dotask installer
        # The explicit local workflow prepares doinstall and verifies both projects.
        shell: ${{ matrix.shell }}
        env:
          DOINSTALL_SOURCE: ${{ github.workspace }}/doinstall-source
        run: ${{ matrix.launcher }} create-dotask-installer
