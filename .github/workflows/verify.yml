name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            launcher: ./build.sh
            shell: bash
          - os: macos-latest
            launcher: ./build.sh
            shell: bash
          - os: windows-latest
            launcher: build.cmd
            shell: cmd
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned doinstall source
        uses: actions/checkout@v4
        with:
          repository: kodybrown/doinstall
          ref: b3150eef78c342e6b81b0d4424ae86c432d50d3b
          path: doinstall-source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Bootstrap and verify
        # Rust CLI, installer, SDK, and native integration tests use this gate.
        shell: ${{ matrix.shell }}
        env:
          DOINSTALL_SOURCE: ${{ github.workspace }}/doinstall-source
        run: ${{ matrix.launcher }} verify
      - name: Package
        shell: ${{ matrix.shell }}
        env:
          DOINSTALL_SOURCE: ${{ github.workspace }}/doinstall-source
        run: ${{ matrix.launcher }} create-installer
